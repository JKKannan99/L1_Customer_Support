<!DOCTYPE html>
<html>
<head>
    <title>Agent Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 10px; border: 1px solid #ccc; }
        select { padding: 5px; }
    </style>
</head>
<body>

<h2>Agent Dashboard</h2>

<table id="agentTable">
    <thead>
        <tr>
            <th>Ticket No</th>
            <th>User ID</th>
            <th>Status</th>
            <th>Change Status</th>
        </tr>
    </thead>
    <tbody></tbody>
</table>


<script>
/* =========================
   JWT ROLE DECODER
   ========================= */
function getRoleFromToken(token) {
    try {
        const payload = JSON.parse(atob(token.split(".")[1]));
        return payload.role;
    } catch (e) {
        return null;
    }
}

/* =========================
   TOKEN + ROLE CHECK
   ========================= */
const token = sessionStorage.getItem("access_token");

if (!token) {
    alert("Session expired. Please login again.");
    window.location.href = "agent_login.html";
    throw new Error("No token");
}

const role = getRoleFromToken(token);

if (role !== "agent") {
    alert("Unauthorized access");
    window.location.href = "agent_login.html";
    throw new Error("Wrong role");
}

/* =========================
   FETCH ALL TICKETS
   ========================= */
fetch("http://127.0.0.1:8000/agent/tickets", {
    headers: {
        "Authorization": "Bearer " + token
    }
})
.then(res => {
    if (!res.ok) {
        throw new Error("HTTP Error: " + res.status);
    }
    return res.json();
})
.then(data => {
    if (!Array.isArray(data)) {
        console.error("Unexpected response:", data);
        return;
    }

    const tbody = document.querySelector("#agentTable tbody");
    tbody.innerHTML = "";

    data.forEach(ticket => {
        const row = document.createElement("tr");

        row.innerHTML = `
            <td>${ticket.ticket_no}</td>
            <td>${ticket.user_id}</td>
            <td>${ticket.status}</td>
            <td>
                <select onchange="updateStatus(${ticket.id}, this.value)">
                    <option value="Open" ${ticket.status === "Open" ? "selected" : ""}>Open</option>
                    <option value="In Progress" ${ticket.status === "In Progress" ? "selected" : ""}>In Progress</option>
                    <option value="Closed" ${ticket.status === "Closed" ? "selected" : ""}>Closed</option>
                </select>
            </td>
        `;

        tbody.appendChild(row);
    });
})
.catch(err => {
    console.error(err);
    alert("Failed to load tickets. Please login again.");
});

/* =========================
   UPDATE TICKET STATUS
   ========================= */
function updateStatus(ticketId, status) {
    fetch(
        `http://127.0.0.1:8000/agent/tickets/${ticketId}/status?status=${encodeURIComponent(status)}`,
        {
            method: "PUT",
            headers: {
                "Authorization": "Bearer " + token
            }
        }
    )
    .then(res => {
        if (!res.ok) {
            throw new Error("Status update failed");
        }
        return res.json();
    })
    .then(() => {
        alert("Status updated successfully");
    })
    .catch(err => {
        console.error(err);
        alert("Failed to update status");
    });
}
</script>

    







</body>
</html>
